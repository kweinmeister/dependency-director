---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "lint"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Run ruff check
        run: uv run ruff check src tests
      - name: Run ruff format check
        run: uv run ruff format --check src tests
      - name: Run ty check
        run: uv run ty check src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: "test"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install sandboxing system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
      - name: Install sandbox-runtime (srt)
        run: sudo npm install -g @anthropic-ai/sandbox-runtime
      - name: Disable AppArmor userns restriction
        run: |
          sudo sysctl -w \
            kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run tests
        run: uv run pytest
