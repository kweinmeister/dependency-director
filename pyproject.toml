[project]
name = "dependency-director"
version = "0.1.0"
description = "Autonomous dependency triage and patching agent using the Google Antigravity SDK."
readme = "README.md"
requires-python = ">=3.13.13"
dependencies = [
    "click>=8.4.2",
    "google-antigravity>=0.1.5",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[project.scripts]
depdirector = "dependency_director.main:cli"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.21",
    "ty>=0.0.56",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dependency_director"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = true
disallow_untyped_decorators = false
python_executable = ".venv/bin/python"

[tool.pyrefly]
python-version = "3.13.0"
ignore-missing-imports = ["*"]

[tool.pyrefly.errors]
bad-override-mutable-attribute = "ignore"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--cov=dependency_director --cov-report=term-missing --durations=10"
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "SLF001", "PLR", "ANN401"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
